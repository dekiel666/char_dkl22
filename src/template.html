<html lang="en">

<title>Character Creator</title>

</head>
<body>
<header class="no-print">
  <div class="brand"><span class="sigil">☩</span> Character <small>Creator</small></div>
  <div class="actions">
    <button class="btn" data-act="newChar">New</button>
    <button class="btn" data-act="saveJson">Save JSON</button>
    <button class="btn" data-act="loadJson">Load JSON</button>
    <button class="btn" data-act="exportExcel">Export Excel</button>
    <button class="btn primary" data-act="print">Print sheet</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>
</header>
<div class="layout">
  <nav id="nav" class="no-print"></nav>
  <main id="main"></main>
  <aside id="summary" class="no-print"></aside>
</div>
<footer class="no-print">For personal use. Page numbers refer to the rulebook. Your character is autosaved in this browser.</footer>

</html>
