<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WFRP 5e Character Creator</title>
<style>:root {
  --bg: #1b1714; --panel: #f4ecd8; --panel2: #ebe0c4; --ink: #2a211b; --muted: #7a6a58; --accent: #8b1a1a;
  --accent2: #b08d3c; --ok: #2f6b2f; --warn: #a3321d; --line: #cbb994;
  --lv1: #2a211b; --lv2: #73974a; --lv3: #c7c8ca; --lv4: #f5d637;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Georgia, "Times New Roman", serif; }
header { display: flex; justify-content: space-between; align-items: center; padding: 10px 18px; background: #120f0d; color: #eadfc4; border-bottom: 3px solid var(--accent); }
.brand { font-size: 22px; letter-spacing: 1px; font-variant: small-caps; }
.brand small { color: var(--accent2); font-size: 15px; }
.sigil { color: var(--accent); }
.layout { display: grid; grid-template-columns: 210px minmax(0, 1fr) 230px; gap: 14px; padding: 14px; max-width: 1600px; margin: auto; }
nav { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 10px; align-self: start; }
.step { text-align: left; padding: 9px 10px; border: 1px solid #3b322a; background: #2a231e; color: #e6d9bb; border-radius: 4px; cursor: pointer; font: inherit; display: flex; justify-content: space-between; }
.step:hover { background: #3a2f27; }
.step.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.badge { background: var(--accent2); color: #1b1714; border-radius: 9px; padding: 0 7px; font-size: 12px; }
.done { color: #8fd18f; }
main { background: var(--panel); border-radius: 6px; padding: 18px 22px; min-height: 70vh; box-shadow: 0 2px 10px #0008; }
aside { background: var(--panel2); border-radius: 6px; padding: 12px; position: sticky; top: 10px; align-self: start; }
aside h3 { margin: 0 0 4px; }
h1 { margin: 0 0 12px; font-variant: small-caps; color: var(--accent); border-bottom: 2px solid var(--line); padding-bottom: 6px; }
h2, h3, h4 { font-variant: small-caps; margin: 14px 0 6px; }
h3 { color: #5b1414; }
.box { background: #fffaf0; border: 1px solid var(--line); border-radius: 5px; padding: 10px 14px; margin: 10px 0; }
.issues { background: #fff1ec; border-color: #e3b3a3; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.card { background: #fffaf0; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.card.selected { border: 2px solid var(--accent); box-shadow: 0 0 0 3px #8b1a1a22; }
.card h3 { margin-top: 0; }
.card p { margin: 4px 0; }
.stats { display: flex; gap: 12px; margin: 4px 0 8px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cols > .box { margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; margin: 8px 0; }
.row label.grow { flex: 1 1 160px; }
.cash-log { margin: 6px 0; padding-left: 1.2em; }
.container-box { margin-top: 10px; }
.container-box ul { margin: 4px 0 0; padding-left: 1.2em; }
.char-other input.num { width: 3.2em; text-align: center; }
.sheet-notes { white-space: pre-wrap; }
.cols.tight { gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
label { display: block; margin: 4px 0; }
label.wide, .wide { grid-column: 1 / -1; }
label.chk { display: inline-flex; gap: 5px; align-items: center; margin-right: 12px; }
input, select, textarea { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 3px; background: #fff; color: var(--ink); max-width: 100%; }
label > input:not([type=checkbox]):not([type=radio]), label > textarea { width: 100%; }
.grid2 label > input { width: calc(100% - 80px); }
input.num { width: 64px; }
input.spec { width: 140px; padding: 2px 4px; }
.btn { font: inherit; padding: 5px 11px; border: 1px solid #6b5a48; border-radius: 4px; background: #e9dfc7; color: var(--ink); cursor: pointer; }
.btn:hover:not([disabled]) { background: #ddcfab; }
.btn.primary { background: var(--accent); border-color: #5e0f0f; color: #fff; }
.btn.primary:hover:not([disabled]) { background: #a52222; }
.btn.sm { padding: 1px 8px; font-size: 13px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
header .btn { background: #2a231e; color: #eadfc4; border-color: #4a3e33; }
header .btn.primary { background: var(--accent); }
table.grid { border-collapse: collapse; width: 100%; }
table.grid th, table.grid td { border-bottom: 1px solid #e2d5b5; padding: 3px 6px; text-align: left; vertical-align: top; }
table.grid th { font-variant: small-caps; color: #5b1414; }
tr.hl { background: #f6e7b8; }
table.scheme { border-collapse: collapse; margin: 6px 0; }
table.scheme th, table.scheme td { border: 1px solid #b9a77f; width: 34px; text-align: center; padding: 2px; }
td.lv1 { background: #2a211b; color: #fff; }
td.lv2 { background: var(--lv2); color: #fff; }
td.lv3 { background: var(--lv3); }
td.lv4 { background: var(--lv4); }
.career .level { margin: 6px 0; padding: 6px 8px; border-left: 3px solid var(--accent2); background: #fbf3df; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.pg { font-size: 12px; color: var(--muted); font-weight: normal; font-variant: normal; border: 1px solid var(--line); border-radius: 8px; padding: 0 6px; margin-left: 4px; }
.tag { font-size: 11px; background: #ddd0ad; border-radius: 3px; padding: 0 4px; }
.ok { color: var(--ok); }
.warn { color: var(--warn); }
.note { background: #f6edd5; padding: 4px 6px; border-radius: 3px; }
.tip { border-bottom: 1px dotted var(--muted); cursor: help; }
.pager { display: flex; justify-content: space-between; margin-top: 18px; }
.mini { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin: 6px 0; }
.mini div { background: #fffaf0; border: 1px solid var(--line); text-align: center; border-radius: 3px; padding: 2px 0; font-size: 12px; }
.mini span { display: block; color: var(--muted); }
.mini2 { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; font-size: 13px; }
.spells { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 4px; }
.spell { display: block; padding: 4px 6px; border: 1px solid #e2d5b5; border-radius: 3px; background: #fff; cursor: pointer; font-size: 14px; }
.spell.on { background: #f6e7b8; border-color: var(--accent2); }
ul.req { list-style: none; padding-left: 4px; }
.shop { max-height: 75vh; overflow: auto; }
.shop input { width: 55%; }
.xpbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.xpbar .right { margin-left: auto; }
.big { font-size: 22px; }
.toolbar { margin-bottom: 10px; }
footer { color: #8a7a66; text-align: center; font-size: 12px; padding: 10px; }
.any { white-space: nowrap; }
hr { border: 0; border-top: 1px solid var(--line); }

/* character sheet */
.sheet { font-size: 13px; }
.sheet h3 { margin: 10px 0 4px; border-bottom: 1px solid var(--line); }
.sheet-head { display: grid; grid-template-columns: 2fr 1fr 1fr 2fr 1fr; gap: 6px 12px; border: 2px solid var(--ink); padding: 8px; }
.sheet-head .wide { grid-column: 1 / -1; }
.lbl { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
.sheet table.chars th, .sheet table.chars td { text-align: center; border: 1px solid #c9b994; }
.sheet table.chars { margin: 8px 0; }
.sheet-stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 6px 0; }
.sheet-stats > div { border: 1px solid var(--ink); padding: 4px 8px; text-align: center; }
.sheet-stats .small { display: block; }
.sheet table.sk td { padding: 1px 5px; }
tr.career-sk td:first-child { font-weight: bold; }
tr.career-sk { background: #f9efcf; }

@media (max-width: 1100px) {
  .layout { grid-template-columns: 1fr; }
  nav { flex-direction: row; flex-wrap: wrap; position: static; }
  aside { position: static; }
  .cols { grid-template-columns: 1fr; }
}
@media print {
  @page { size: A4; margin: 10mm; }
  body { background: #fff; font-size: 11px; }
  .no-print, header, nav, aside, footer, .pager, .issues { display: none !important; }
  .layout { display: block; padding: 0; }
  main { box-shadow: none; padding: 0; background: #fff; }
  .sheet { font-size: 10.5px; }
  .sheet h3 { break-after: avoid; }
  table { break-inside: auto; }
  tr { break-inside: avoid; }
  tr.career-sk, tr.hl { background: #eee !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  td.lv1, td.lv2, td.lv3, td.lv4 { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<header class="no-print">
  <div class="brand"><span class="sigil">☩</span> WFRP 5e <small>Character Creator</small></div>
  <div class="actions">
    <button class="btn" data-act="newChar">New</button>
    <button class="btn" data-act="saveJson">Save JSON</button>
    <button class="btn" data-act="loadJson">Load JSON</button>
    <button class="btn" data-act="exportExcel">Export Excel</button>
    <button class="btn primary" data-act="print">Print sheet</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>
</header>
<div class="layout">
  <nav id="nav" class="no-print"></nav>
  <main id="main"></main>
  <aside id="summary" class="no-print"></aside>
</div>
<footer class="no-print">Built from <i>WFRP 5e – Rulebook (v.2026-08-31)</i> for personal use. Page numbers refer to that rulebook. Your character is autosaved in this browser.</footer>
<script>const DATA = {"skills":[{"name":"Climb","char":"S","advanced":false,"grouped":false,"specs":null,"desc":"The ability to ascend steep or vertical surfaces, like a perilous mountainside or the rain-slick wall of a tumbledown townhouse. Climbing can sometimes be used in combat when facing especially monstrous foes — see page 162 for combat movement.","page":111},{"name":"Consume Alcohol","char":"T","advanced":false,"grouped":false,"specs":null,"desc":"How well you can handle alcohol without letting it cloud your judgment or render you senseless. Often used to impress those who find the ability to down an unreasonable number of beverages to be praiseworthy.","page":111},{"name":"Cool","char":"WP","advanced":false,"grouped":false,"specs":null,"desc":"Allows you to remain calm under stress, resist fear in the face of horror, and stick to your convictions. It is generally used to resist the attempts of others to Charm or Intimidate you, or to curtail other Psychological effects (see page 183).","page":111},{"name":"Dodge","char":"Ag","advanced":false,"grouped":false,"specs":null,"desc":"Avoid things through ducking, diving, and moving quickly, and is used extensively to sidestep falling rocks, incoming weapons, and the like. In combat, Dodge is generally used to resist attacks or avoid damage.","page":111},{"name":"Drive","char":"Ag","advanced":false,"grouped":false,"specs":null,"desc":"Maneuvering vehicles — most commonly simple carts and lumbering coaches, but also the more experimental creations of Imperial Engineers — along the roads of the Empire with as little incident as possible.","page":111},{"name":"Endurance","char":"T","advanced":false,"grouped":false,"specs":null,"desc":"Called upon when you must endure hardship, withstand deprivation, stand without moving for long periods of time, or survive harsh environments. In particular, Endurance is Tested to resist or recover from various Conditions (see page 184) and helps you recover lost Wounds (see page 170).","page":111},{"name":"Entertain","char":"Fel","advanced":false,"grouped":true,"specs":["Acting","Comedy","Singing","Storytelling"],"desc":"Delight crowds with the spoken word, perhaps by singing, acting, or attempting a few jokes — hopefully entertaining all those within earshot.","page":111},{"name":"Evaluate","char":"Int","advanced":true,"grouped":false,"specs":null,"desc":"Lets you determine the value of goods. Everybody is assumed to know the relative worth of general items, but Evaluate allows you to identify the value of curious and unique items, recognise forgeries, or spot flaws.","page":111},{"name":"Animal Care","char":"Int","advanced":true,"grouped":false,"specs":null,"desc":"Care for animals and heal them from disease or injury. A Character with an Advance in this Skill can keep animals healthy under normal conditions without needing to Test. A Test is required to diagnose or resolve problems with animals, such as spotting signs of illness or healing an injury (page 171).","page":111},{"name":"Animal Training","char":"Int","advanced":true,"grouped":true,"specs":["Demigryph","Dog","Hawk","Horse","Pigeon Your understanding of a particular type of animal","and ability to train them"],"desc":"To train a beast, undertake the Animal Training Endeavour between adventures (see page 196).","page":111},{"name":"Art","char":"Dex","advanced":false,"grouped":true,"specs":["Drawing","Engraving","Mosaics","Painting","Sculpture","Tattooing","Weaving","Writing"],"desc":"Create works of art in your chosen medium. The more SL achieved, the better the quality of the final piece. For complicated or large works of art, an Extended Test may be required.","page":111},{"name":"Athletics","char":"Ag","advanced":false,"grouped":false,"specs":null,"desc":"Your ability to run, jump, move or perform any other general physical activity.","page":111},{"name":"Bribery","char":"Fel","advanced":false,"grouped":false,"specs":null,"desc":"Find someone who is willing to accept a bribe, such as a guild notary to accept forged paperwork or a gate guard to look the other way while you slip inside after nightfall. You can also make a Bribery Test to judge if a particular person could be bribed, and what their price is likely to be.","page":111},{"name":"Channelling","char":"WP","advanced":true,"grouped":true,"specs":null,"desc":"Specialisations Include: Aqshy, Azyr, Chamon, Dhar, Ghur, Ghyran, Hysh, Magick, Shyish, Ulgu. Ability to call upon and control the various Winds of Magic, solely used with the magic rules. See Chapter 8: Magic for details.","page":111},{"name":"Charm","char":"Fel","advanced":false,"grouped":false,"specs":null,"desc":"Makes people think favourably of you, your opinions, and actions you propose. People won’t necessarily do what you say simply because you’ve passed a Charm Test, but they will at least give you due consideration.","page":111},{"name":"Charm Animal","char":"WP","advanced":false,"grouped":false,"specs":null,"desc":"Your aptitude for befriending, quickly calming, or subjugating animals. A Charm Animal Test can convince a wild animal to back off, or a guard dog to devour a proffered scrap of meat rather than your arm.","page":111},{"name":"Intuition","char":"I","advanced":false,"grouped":false,"specs":null,"desc":"Gives you a feel for your surroundings, to notice when something is wrong, and read people to sense when they are lying or hiding something.","page":112},{"name":"Language","char":"Int","advanced":true,"grouped":true,"specs":["Bretonnian","Reikspiel","Wastelander","and many more"],"desc":"See page 149. Access to extra languages beyond your native tongue. A single Advance is enough to make yourself understood in that language, but a Test may be required to comprehend complicated discussions. Once you have 4 Advances, you count as fluent and no longer need to make Tests.","page":112},{"name":"Leadership","char":"Fel","advanced":false,"grouped":false,"specs":null,"desc":"Your ability to lead others and command respect. While most often associated with martial situations, a resolute leader can quickly direct a fast response to a fire or other such calamity, and nobles use the Skill frequently to command their lessers.","page":112},{"name":"Lore","char":"Int","advanced":true,"grouped":true,"specs":["Engineering","Geology","Heraldry","History","Law","Local*","Magic","Metallurgy","Science","Theology"],"desc":"Knowledge of a subject you have been taught or have first-hand knowledge of. Basic facts related to a specific Lore Skill can be recalled easily, with a Test required only to recall obscure or unusual information.","page":112},{"name":"Melee","char":"WS","advanced":false,"grouped":true,"specs":["Basic","Brawling","Cavalry","Fencing","Flail","Parry","Polearm","Two-handed"],"desc":"Training and experience with a single type of close combat weaponry. Each Melee Specialisation indicates expertise in using a specific class of weapon. If you do not have the correct Specialisation for a weapon, you will usually suffer a penalty when using it — see Chapter 11: Consumer Guide for more.","page":112},{"name":"Navigation","char":"I","advanced":false,"grouped":false,"specs":null,"desc":"Allows you to find your way in the wilderness, or across the ocean, using landmarks, stellar bodies, charts, or maps.","page":112},{"name":"Outdoor Survival","char":"Int","advanced":false,"grouped":false,"specs":null,"desc":"Used to survive in the wild, including the ability to fish, hunt, forage, and build fires and shelters. Experienced survivors are practiced at reading the signs of incoming inclement weather, making do with minimal tools, and noticing the spoor of local beasts.","page":112},{"name":"Gamble","char":"Int","advanced":false,"grouped":false,"specs":null,"desc":"Measure the likelihood that a bet will pay off, as well as successfully engage in various games of chance. If you wish to improve your chances through cheating, see page 135.","page":112},{"name":"Gossip","char":"Fel","advanced":false,"grouped":false,"specs":null,"desc":"Ferret out interesting and useful news, and spread rumours of your own. Best practised at a town square, inn, well, or other gathering place.","page":112},{"name":"Haggle","char":"Fel","advanced":false,"grouped":false,"specs":null,"desc":"Secure better deals when negotiating with others, when purchasing goods for example. Typically involves an Opposed Haggle Test (page 131).","page":112},{"name":"Heal","char":"Int","advanced":true,"grouped":false,"specs":null,"desc":"You have been trained to deal with injuries and diseases. A successful Heal Test allows you to diagnose illness, treat a disease, heal wounds or staunch a Bleeding Condition. Full rules for illness, injury, and treatments can be found on page 172.","page":112},{"name":"Intimidate","char":"S","advanced":false,"grouped":false,"specs":null,"desc":"Coerce or frighten sentient creatures — generally with an overt threat, though sometimes a subtle implication or even a look is enough.","page":112},{"name":"Pray","char":"Fel","advanced":true,"grouped":false,"specs":null,"desc":"Invoke, appeal to, or otherwise commune with a deity. For more information on using the Pray Skill to seek divine intervention, see Chapter 7: Religion and Belief.","page":113},{"name":"Ranged","char":"BS","advanced":true,"grouped":true,"specs":["Blackpowder","Bow","Crossbow","Engineering","Entangling","Explosives","Sling","Throwing"],"desc":"Each Ranged Specialisation is specific to a group of ranged weapons. If you do not have the Ranged Specialisation for a weapon you wish to use, refer to Chapter 11: Consumer Guide for the penalties you will suffer when using the weapon.","page":113},{"name":"Research","char":"Int","advanced":true,"grouped":false,"specs":null,"desc":"Finding useful and frequently obscure knowledge in libraries and other such storehouses of information. Research requires you to have the Read/Write Talent (see page 124). More on what kinds of information you can find and where to start looking can be found on page 150.","page":113},{"name":"Ride","char":"Ag","advanced":false,"grouped":true,"specs":["Demigryph","Griffon","Horse","Pegasus"],"desc":"Proficiency at riding a particular group of animals; Ride (Horse), for example, will let you ride horses, mules, donkeys, and similar. See page 168 for rules on fighting from the back of a mount.","page":113},{"name":"Row","char":"S","advanced":false,"grouped":false,"specs":null,"desc":"Your prowess at pulling an oar to move a boat through the water. A Row Test is typically only needed when racing, navigating rapids, desperately avoiding bog octopuses, or similar challenging feats.","page":113},{"name":"Sail","char":"Ag","advanced":true,"grouped":false,"specs":null,"desc":"Operate and manoeuvre a sailing vessel — including knotwork, steering, gauging the wind, and more. Sail is required to operate your own vessel, either alone or as part of a crew. If you are commanding a well trained crew, use Leadership instead.","page":113},{"name":"Perception","char":"I","advanced":false,"grouped":false,"specs":null,"desc":"Your ability to notice things with your senses — sight, smell, hearing, touch, taste, and any other senses you may possess, such as magical or inhuman senses.","page":113},{"name":"Perform","char":"Ag","advanced":true,"grouped":true,"specs":["Acrobatics","Clowning","Dancing","Firebreathing","Juggling","Miming","Rope Walking"],"desc":"You have learned a physically demanding art, perhaps as a way to make a living. A successful Perform Test lets you entertain those near enough to see you.","page":113},{"name":"Pick Lock","char":"Dex","advanced":true,"grouped":false,"specs":null,"desc":"You know the mechanisms of locks and how to open them without their proper keys. Many locks are simple affairs made to vex only untutored thieves, while others can be complex dwarf-made mechanisms capable of frustrating all but the most determined plunderer.","page":113},{"name":"Play","char":"Dex","advanced":true,"grouped":true,"specs":["Bagpipe","Lute","Harpsichord","Horn","Violin"],"desc":"A successful Play Test lets you entertain those near enough to hear you. You choose your initial Talents as part of creating your Character.","page":113},{"name":"Secret Signs","char":"Int","advanced":true,"grouped":true,"specs":["Grey Order","Guild (Any One)","Ranger","Scout","Thief","Vagabond"],"desc":"Vagabonds might indicate which homeowners are likely to offer alms, thieves may want to indicate territorial markings or warnings, while scouts may want to warn one another about a dangerous monster’s lair nearby (see page 138).","page":114},{"name":"Set Trap","char":"Dex","advanced":true,"grouped":false,"specs":null,"desc":"From a simple snare or bear trap, to more spectacular devices like Von Grizzel’s Thief-render, players are unlikely to venture far in the Old World without encountering traps. The Set Trap Skill measures your ability to set and disarm traps of all varieties.","page":114},{"name":"Sleight of Hand","char":"Dex","advanced":true,"grouped":false,"specs":null,"desc":"Your ability to pick pockets, palm objects, and perform minor tricks of prestidigitation, as well as cheat at games of chance. This Skill is typically Opposed by the Perception Skill of your target.","page":114},{"name":"Stealth","char":"Ag","advanced":false,"grouped":true,"specs":["Rural","Underground","Urban"],"desc":"Move and hide without being detected, blend into a crowd, or otherwise avoid drawing attention to yourself.","page":114},{"name":"Swim","char":"S","advanced":true,"grouped":false,"specs":null,"desc":"Moving and staying afloat in water. If you have the Swim Skill, you are automatically presumed to be able to swim freely without a Test. But if you find yourself in difficult currents, racing, or fleeing from a ravenous stirpike, a Test will be required.","page":114},{"name":"Track","char":"I","advanced":true,"grouped":false,"specs":null,"desc":"Your ability to follow subtle trails left by others. Track is used to follow and find your target, as well as to hide your trail.","page":114},{"name":"Trade","char":"Dex","advanced":true,"grouped":true,"specs":["Apothecary","Calligrapher","Chandler","Carpenter","Cook","Embalmer","Engineer","Herbalist","Shipwright","Smith","Tanner"],"desc":"Your ability to practice a trade, to create something or provide a service, as well as your knowledge of the relevant lore surrounding your trade.","page":114}],"talents":[{"name":"Accurate Shot","base":"Accurate Shot","spec":null,"multi":false,"desc":"You are an exceptional shot and know where to shoot an enemy to inflict maximum damage. Your successful Ranged Attacks inflict +1 Damage, or +2 if you took the time to aim (page 167).","page":114},{"name":"Acute Sense (Sense)","base":"Acute Sense","spec":"Sense","multi":true,"desc":"You may take Perception Tests to detect normally imperceptible details with the associated sense, as dictated by the GM. For example, you might be able to hear the difference between the cry of one wolf and another, or taste the difference between the exact same vintage of wine bottled on two different days.","page":114},{"name":"Aethyric Attunement","base":"Aethyric Attunement","spec":null,"multi":true,"desc":"Your experience, talent, or training lets you accumulate magical energy with a reduced risk of miscasts. If you would roll on the Minor Miscast Table, you may roll twice and choose whichever result you prefer. You may purchase this Talent a second time to gain the same benefit when rolling on the Major Miscast Table.","page":114},{"name":"Alley Cat","base":"Alley Cat","spec":null,"multi":false,"desc":"You are at home in cities, able to move about without drawing attention to yourself and vanish into any crowd. You gain Advantage on Stealth (Urban) Tests, and can figure out the quickest or least noticeable way to get across any town or city you are familiar with without making a Test.","page":114},{"name":"Ambidextrous","base":"Ambidextrous","spec":null,"multi":false,"desc":"You can use your off-hand far better than most folk, either by training or innate talent. You do not suffer the –2 SL penalty to Tests relying solely on your secondary hand, including attacks made with weapons held in that hand.","page":114},{"name":"Animal Affinity","base":"Animal Affinity","spec":null,"multi":false,"desc":"As long as you do not act aggressively towards them, wild animals will not ordinarily attack you. Specialisations: Grey Order, Guild (Any One), Ranger, Scout, Thief, Vagabond. You have been taught how to use clandestine markings only intelligible to members of a select group.","page":114},{"name":"Battle Rage","base":"Battle Rage","spec":null,"multi":false,"desc":"You are always on the edge of self-control, ready to slip into a violent Frenzy at any moment (see page 184). If another ability would allow you to enter a state of Frenzy, you may do so without making a Test. Furthermore, when you exit the Frenzy state, you do not incur a Fatigued Condition.","page":115},{"name":"Beat Blade","base":"Beat Blade","spec":null,"multi":false,"desc":"Upon a successful Melee Attack, you may choose to forgo inflicting any Damage. If you do so, your opponent may not Oppose further Melee Tests with any Melee Skill until the end of their next Turn, and Melee Attacks made against them gain the benefit of Advantage. They may continue to oppose attacks with the Dodge Skill.","page":115},{"name":"Beneath Notice","base":"Beneath Notice","spec":null,"multi":false,"desc":"As long as you are properly attired and make some effort to fit in, most people will simply assume you are meant to be there. Gate guards and the like may ask your business, but any plausible explanation is sufficient for them to grant you passage.","page":115},{"name":"Berserk Charge","base":"Berserk Charge","spec":null,"multi":false,"desc":"You hurl yourself at your enemies with reckless abandon, using the force of your charge to add weight to your strike. When you Charge, add +2 Damage to your strike.","page":115},{"name":"Blather","base":"Blather","spec":null,"multi":false,"desc":"When you are caught, make a Charm Test, Opposed by your target’s Cool. If you pass, your preposterous explanation convinces them for one Turn (or minute, depending on the situation) per SL you achieved on the Opposed Test.","page":115},{"name":"Arcane Magic (Lore)","base":"Arcane Magic","spec":"Lore","multi":false,"desc":"Upon learning the Talent, you gain one Spell of your choice from your chosen Lore. You may now memorise additional Spells from your chosen Lore for the following cost in XP. You may normally learn only one Arcane Lore of Magic.","page":115},{"name":"Argumentative","base":"Argumentative","spec":null,"multi":false,"desc":"When you argue with someone, they must pass a Cool Test, opposed by your Charm, to disengage from a pointless debate with you. While arguing they are distracted, suffering a -3 SL penalty to most Tests unrelated to you, unless a more important issue is brought to their attention, or they are attacked.","page":115},{"name":"Artistic (Art)","base":"Artistic","spec":"Art","multi":true,"desc":"You may always advance the Art Skill, even if it is not part of your current Career. When you choose this Talent, pick one form of written or representative art, such as painting or poetry. You gain Advantage on Art Tests when working in that medium.","page":115},{"name":"Attractive","base":"Attractive","spec":null,"multi":false,"desc":"When you successfully use Charm to influence those attracted to you, you can choose to either use your rolled SL, or the number rolled on your units die. Number of Spells currently known XP Cost for a new Spell Up to 5 100 XP 6 to 10 200 XP 11 to 15 300 XP 16 to 20 400 XP 21 and up 500 XP","page":115},{"name":"Catfall","base":"Catfall","spec":null,"multi":false,"desc":"You are as nimble and balanced as a cat. Whenever you fall, it counts as a deliberate fall, allowing you to make an Athletics Test to reduce any Damage incurred. You also gain Advantage on Athletics Tests made while falling.","page":116},{"name":"Cat-tongued","base":"Cat-tongued","spec":null,"multi":false,"desc":"Like Ranald the Trickster God, you blend truth and lies as if there were no difference. You gain Advantage on any Charm Test you make to lie convincingly.","page":116},{"name":"Chaos Magic (Lore)","base":"Chaos Magic","spec":"Lore","multi":false,"desc":"Your ruinous patron immediately grants you access to Spells from the chosen Chaos Lore. Upon learning the Talent, you gain one Spell of your choice from your chosen Lore. You may now memorise additional Spells from your chosen Lore for the following cost in XP.","page":116},{"name":"Combat Aware","base":"Combat Aware","spec":null,"multi":false,"desc":"You are used to scanning the battlefield to make snap decisions informed by the shifting tides of war. You may take a Challenging (+0 SL) Perception Test to avoid gaining the Surprised Condition. If the GM would normally allow a Test to ignore Surprise in this circumstance, you automatically succeed.","page":116},{"name":"Combat Master","base":"Combat Master","spec":null,"multi":false,"desc":"You are adept at making your presence felt on the battlefield, using your size or speed to corner your opponents. You count as two people for the purposes of outnumbering an opponent, or when determining if your side is outnumbered. See page 167 for the rules for outnumbering.","page":116},{"name":"Bless (Deity)","base":"Bless","spec":"Deity","multi":false,"desc":"Upon learning the Talent, you manifest all the Blessings of the deity you worship. Under normal circumstances, you may not learn more than one Bless (Deity) Talent. Further, you may not learn the Channelling Skill or the Arcane Magic, Chaos Magic, Magic Resistance, Petty Magic, or Witch!","page":116},{"name":"Bookish","base":"Bookish","spec":null,"multi":false,"desc":"You are an avid reader, and know how to quickly navigate your way around a library. You gain Advantage on any Research Test you make.","page":116},{"name":"Break and Enter","base":"Break and Enter","spec":null,"multi":false,"desc":"Just by observing a building, locked room, or vault, you can determine what looks to be the fastest and quietest route in. Additionally, you have Advantage on Pick Lock Tests, or Strength Tests made to force open doors or windows.","page":116},{"name":"Briber","base":"Briber","spec":null,"multi":false,"desc":"You need only share a few words with someone to know if they are open to a bribe, and exactly how much would be required to have them turn a blind eye, or even assist in some nefarious activity. You have Advantage on any Bribery Test you make.","page":116},{"name":"Cardsharp","base":"Cardsharp","spec":null,"multi":false,"desc":"You are used to playing, and winning, at games, although your methods may involve a little cheating. When making an Opposed Gamble Test, if you roll a double, you may reroll your opponent’s Test. This additionally negates any benefit your opponent may have gained with Sleight of Hand.","page":116},{"name":"Careful Strike","base":"Careful Strike","spec":null,"multi":false,"desc":"You are skilled at hitting your enemy exactly where you want to. When making a Melee Attack, the penalty for making a Called Shot is reduced to -1 SL. If your attack is made with Advantage, you may make a Called Shot at no penalty.","page":116},{"name":"Carouser","base":"Carouser","spec":null,"multi":false,"desc":"You do not suffer any ill effects from consuming modest amounts of alcohol, and only need to make a Consume Alcohol Test if drinking to excess — for example, if attempting to impress a bar full of dwarfs.","page":116},{"name":"Craftsman (Trade)","base":"Craftsman","spec":"Trade","multi":true,"desc":"Choose a Trade Specialisation. You gain Advantage on Tests of this skill, and may Advance it even if it is not part of your current Career. You may purchase this Talent more than once, choosing a new Trade Specialisation each time you do.","page":117},{"name":"Criminal","base":"Criminal","spec":null,"multi":false,"desc":"When you successfully use the Income Endeavour to earn coin from a criminal enterprise of any kind, double the resulting coin. Whether through distinctive tattoos, shifty looks, or a rough demeanour, your criminal nature is hard to hide.","page":117},{"name":"Deadeye Shot","base":"Deadeye Shot","spec":null,"multi":false,"desc":"You always hit an opponent right between the eyes, or wherever else you intend to hit. When making a Ranged Attack, the penalty for making a Called Shot is reduced to -1 SL, or removed entirely if you are making an aimed shot (page 167).","page":117},{"name":"Dealmaker","base":"Dealmaker","spec":null,"multi":false,"desc":"You are a skilled businessman who knows how to close a deal. You gain Advantage on any Haggle Test you make, and usually have a good idea of when an offer really is final.","page":117},{"name":"Detect Artefact","base":"Detect Artefact","spec":null,"multi":false,"desc":"You are able to sense when magic lies within an artefact. You can automatically tell if an item contains magical energy merely by touching it. If you also possess the Second Sight Talent, you may attempt an Intuition Test to determine the exact powers, means of activation, and number of charges the item possesses.","page":117},{"name":"Combat Reflexes","base":"Combat Reflexes","spec":null,"multi":false,"desc":"You react quickly to danger, leaping to attack your enemy without pause. When you roll for Combat Initiative, roll twice and choose your prefered result.","page":117},{"name":"Commanding Presence","base":"Commanding Presence","spec":null,"multi":false,"desc":"Your presence inspires awe and admiration. In the absence of recognised authority, most people naturally look to you for leadership in a crisis and follow any reasonable orders you give. In addition, you gain Advantage on Leadership Tests.","page":117},{"name":"Concoct","base":"Concoct","spec":null,"multi":false,"desc":"You may make a free Crafting Endeavour each session to use Trade (Apothecary, Herbalist, or Poisoner) without the need for a Workshop. Trade Tools and raw materials are still required.","page":117},{"name":"Contortionist","base":"Contortionist","spec":null,"multi":false,"desc":"You can bend and manipulate your body in a myriad of seemingly unnatural ways. This allows you to squeeze through gaps that would normally be difficult or impossible, at the GM’s discretion. You gain Advantage on any Athletics Test made to escape from bonds.","page":117},{"name":"Coolheaded","base":"Coolheaded","spec":null,"multi":false,"desc":"Gain +5 Willpower. This does not count toward Advances.","page":117,"bonus":"WP"},{"name":"Crack the Whip","base":"Crack the Whip","spec":null,"multi":false,"desc":"You know how to get the most out of your animals. Assuming you have the Drive Skill, you can direct your vehicle’s animals to take an Action, as well as a Move, without a Test. When a Drive Test is required, make it with Advantage. When driving a vehicle in a Pursuit, add +1 to the animals’ Movement Attributes.","page":117},{"name":"Dicer","base":"Dicer","spec":null,"multi":false,"desc":"You are a gaming master, so skilled and lucky in most games of chance that you are frequently accused of cheating, despite rarely needing to. You gain Advantage on any Gamble Test you make.","page":118},{"name":"Dirty Fighting","base":"Dirty Fighting","spec":null,"multi":false,"desc":"You have been taught all the dirty tricks of unarmed combat. If you make a Called Shot to the body with an unarmed strike and deal any Wounds, you may choose to sacrifice the normal Damage to inflict the Low Blow! Critical Wound (see page 175).","page":118},{"name":"Disarm","base":"Disarm","spec":null,"multi":false,"desc":"Upon a successful melee strike as the attacker, you may choose to sacrifice the Damage. If you do so, your opponent loses a held weapon, which flies 1d10 feet in a random direction. If you wish, you may lose Momentum to pluck the weapon from the air with a flourish.","page":118},{"name":"Distract","base":"Distract","spec":null,"multi":false,"desc":"Upon a successful Melee Attack, you may choose to sacrifice the Damage. If you do so, your opponent loses Momentum and cannot regain it, or make any Test with Advantage for any other reason, until the end of your next Turn.","page":118},{"name":"Doomed","base":"Doomed","spec":null,"multi":false,"desc":"During the incense-laden rite, a priest of Morr known as a doomsayer foretold the manner of your death. In conjunction with your GM, devise a suitable Doom.","page":118},{"name":"Drilled","base":"Drilled","spec":null,"multi":false,"desc":"Allies may freely Disengage from an opponent you are also Engaged with as you cover their retreat. Additionally, on your Turn you may lose Momentum in order to grant Momentum to any allies you are standing shoulder to shoulder with, so long as they also have this Talent.","page":119},{"name":"Dual Wielder","base":"Dual Wielder","spec":null,"multi":false,"desc":"You have a knack for fighting with a weapon in each hand. When fighting with two weapons (see page 167), you do not have to lose Momentum in order to make a free attack with a second weapon. Additionally, when fighting with two weapons, Daggers, Knives, and similar weapons you wield gain the Parry Quality.","page":119},{"name":"Embezzle","base":"Embezzle","spec":null,"multi":false,"desc":"When Earning during play or performing an Income Endeavour, you can embezzle funds, by using Bribery or Evaluate in place of your normal Earning Skill. If you do this, a successful Test indicates that you have doubled your money.","page":119},{"name":"Enclosed Fighter","base":"Enclosed Fighter","spec":null,"multi":false,"desc":"You have learned to make the most benefit out of fighting in enclosed spaces. You ignore penalties to Melee Tests caused by confined spaces such as tunnels, the frontline, small fighting pits, and similar. You can also use the Dodge Skill even if it would normally be disallowed due to lack of space.","page":119},{"name":"Etiquette (Social Group)","base":"Etiquette","spec":"Social Group","multi":false,"desc":"You can blend in socially with the chosen group, so long as you are dressed and acting appropriately. Furthermore, the GM may warn your Character if they begin to indulge in behaviour considered inappropriate by the social group. Example social groups include: Criminals, Cultists, Guilders, Nobles, and Soldiers.","page":119},{"name":"Fast Hands","base":"Fast Hands","spec":null,"multi":false,"desc":"You can move your hands with surprising dexterity. You can use Sleight of Hand to entertain people by making small objects vanish or appear. You gain Advantage on Sleight of Hand Tests, as well as Melee (Brawling) Tests made to touch an opponent, such as those required by some spells.","page":119},{"name":"Fast Shot","base":"Fast Shot","spec":null,"multi":false,"desc":"If you are not Engaged, you may make a single attack with a loaded weapon with the Pistol Trait before the first turn of the Round. This attack uses your Action for the Round. If multiple Characters use Fast Shot, resolve their attacks in Combat Initiative order.","page":119},{"name":"Fearless (Enemy)","base":"Fearless","spec":"Enemy","multi":true,"desc":"When you take this Talent, choose any enemy group, such as Giants, Skeletons, or Trolls. You are immune to fear from enemies in the chosen group. You may acquire this Talent more than once, choosing a new enemy group each time you do so.","page":119},{"name":"Feint","base":"Feint","spec":null,"multi":false,"desc":"You have trained how to make false attacks in close combat to fool your opponent. When attacking in melee, if you have Advantage and your opponent does not, you can force them to defend with Intuition instead of any other Skill or Characteristic.","page":119},{"name":"Field Dressing","base":"Field Dressing","spec":null,"multi":false,"desc":"You are used to treating wounds quickly with whatever suitable materials you can find at hand. You make Heal Tests with Advantage, and can easily create basic splints or bandages from ordinary materials.","page":119},{"name":"Fisherman","base":"Fisherman","spec":null,"multi":false,"desc":"Assuming a large enough body of water is available, and you have the right gear such as a rod or net, you are able to fish enough to feed yourself and a number of others equal to your Initiative Bonus. You may secure more fish in addition to this using the normal rules for foraging (see page 152).","page":119},{"name":"Flagellant","base":"Flagellant","spec":null,"multi":false,"desc":"You feel no pain and may ignore penalties inflicted by Critical Wounds, other than amputations. Additionally, if another ability or effect allows you to Frenzy (page 184), you may enter a Frenzy any time you suffer a Wound without requiring a Test.","page":119},{"name":"Hatred (Group)","base":"Hatred","spec":"Group","multi":false,"desc":"You develop Hatred for a group. When encountering the subject of your Hatred, you must attempt a Psychology Test or immediately attempt to destroy the hated group by the fastest and most deadly means possible.","page":120},{"name":"Holy Hatred","base":"Holy Hatred","spec":null,"multi":false,"desc":"Your prayers drip with the hatred you feel for your blasphemous enemies. When causing Wounds with a Miracle, you may deal +2 Wounds.","page":120},{"name":"Holy Visions","base":"Holy Visions","spec":null,"multi":false,"desc":"You clearly see the great works of the gods all around you. You automatically know when you enter holy ground, can perceive Blessings, Miracles, and Chaos Magic Spells cast within your line of sight, and can sense divine power in an object with a touch.","page":120},{"name":"Hunter’s Eye","base":"Hunter’s Eye","spec":null,"multi":false,"desc":"When travelling through well-stocked lands, you are automatically assumed to be able to hunt down enough game to feed yourself and a number of others equal to your Initiative Bonus, so long as you have time and the correct equipment.","page":120},{"name":"Flee!","base":"Flee!","spec":null,"multi":false,"desc":"When your life is on the line, you are capable of impressive bursts of speed. If you Disengage from combat, you may immediately make an extra Move to sprint away from your opponent. If you choose to Flee in combat (page 163), you do not gain any Broken Conditions. Tests as the Quarry in a Pursuit benefit from +1 SL.","page":120},{"name":"Fleet-footed","base":"Fleet-footed","spec":null,"multi":false,"desc":"You are unusually fast on your feet, and gain +1 to your Movement Attribute.","page":120},{"name":"Frenzy","base":"Frenzy","spec":null,"multi":false,"desc":"You have a deep well of fury inside you, which you can unleash upon your enemies. Making a successful Willpower Test lets you enter a Frenzy, allowing you to make additional attacks, ignore most psychological effects, and inflict additional Damage in melee. The full rules for Frenzy are described on page 184.","page":120},{"name":"Frightening","base":"Frightening","spec":null,"multi":false,"desc":"You gain the Fear Trait with a rating of 1, or 2 if you are Large (see page 360). Enemies must pass an Extended Psychology Test, requiring a number of successes equal to your Fear rating, with one Test made each turn. Until they do, they cannot gain Momentum, and you gain Advantage on Melee Attacks against them.","page":120},{"name":"Furious Assault","base":"Furious Assault","spec":null,"multi":false,"desc":"Your blows follow one another in quick succession, raining down on your opponents with the fury of Ulric. Once per Round, if you hit an opponent in melee, you may immediately lose Momentum to make an extra attack.","page":120},{"name":"Gregarious","base":"Gregarious","spec":null,"multi":false,"desc":"You just like talking to other folk, and it seems they like talking to you. You gain Advantage on any Gossip Tests you make, and can usually tell where in a settlement gossip is likely to be exchanged.","page":120},{"name":"Gunner","base":"Gunner","spec":null,"multi":false,"desc":"You are practised in the use of blackpowder weapons, and are able to lessen some of their more obvious dangers. When using a Blackpowder, Engineering, or Explosive weapon, you ignore the Dangerous Flaw.","page":120},{"name":"Hardy","base":"Hardy","spec":null,"multi":true,"desc":"When calculating your Wounds total, add your Toughness Bonus an additional time.","page":120},{"name":"Impassioned Zeal (Cause)","base":"Impassioned Zeal","spec":"Cause","multi":false,"desc":"When you talk about your cause, your words fill with passion and fervent zeal. You gain Advantage on Charm Tests when speaking on these matters. You also find it hard to deny, or prevaricate about the cause, and suffer Disadvantage when lying about or denouncing the subject of your passions.","page":121},{"name":"Implacable","base":"Implacable","spec":null,"multi":false,"desc":"It takes a lot to finish you off. Any time you would gain one or more Bleeding Conditions, you gain one less.","page":121},{"name":"In-fighter","base":"In-fighter","spec":null,"multi":false,"desc":"As your Action, you can perform an Opposed Melee Test to attempt to step inside your opponent’s weapon length. The winner chooses if combat continues as normal or as ‘in-fighting’. During in-fighting, any weapon longer than Short counts as an Improvised Weapon.","page":121},{"name":"Inspiring","base":"Inspiring","spec":null,"multi":false,"desc":"Your rousing words and pleas can turn the tide of battle. You have Advantage when you make Leadership Tests in combat.","page":121},{"name":"Instinctive Diction","base":"Instinctive Diction","spec":null,"multi":false,"desc":"You instinctively understand Magick and are capable of articulating complex phrases rapidly and without error. If you are required to roll on the Minor Miscast Table, you may reduce the result by 20. If the final result is less than 01, then no Miscast occurs. If you generate a Major Miscast this Talent has no effect.","page":121},{"name":"Invoke (Deity)","base":"Invoke","spec":"Deity","multi":false,"desc":"Upon learning the Talent, you gain one Miracle of your choice from those available to your patron. You may now memorise additional Miracles from those available to your patron for the following cost in XP. Under normal circumstances, you may not learn more than one Invoke (Deity) Talent.","page":121},{"name":"Iron Jaw","base":"Iron Jaw","spec":null,"multi":false,"desc":"You are made of sturdy stuff and can weather even the strongest blows. The first time in an encounter you would gain one or more Stunned Conditions, you gain one less.","page":121},{"name":"Iron Will","base":"Iron Will","spec":null,"multi":false,"desc":"You possess an indomitable will, and resist willingly bowing down before another. You gain Advantage on Cool Tests made to resist the influence of others, be it through a Fellowship Test or magical means.","page":121},{"name":"Jump Up","base":"Jump Up","spec":null,"multi":false,"desc":"You move with grace and are hard to keep down. You gain Advantage when making a Perform (Acrobatics) Test to entertain or move quickly outside of combat. Whenever you suffer the Prone Condition, you may immediately attempt a Challenging (+0 SL) Athletics or Perform (Acrobatics) Test to spring back to your feet.","page":121},{"name":"Kingpin","base":"Kingpin","spec":null,"multi":false,"desc":"You have earned an air of respectability despite your nefarious ways. The Criminal Talent no longer makes law enforcers suspect you or prevents you from accessing certain Careers. Most other Criminals recognise you as someone to respect — unless they’re well prepared and gunning for your position and status.","page":121},{"name":"Lightning Reflexes","base":"Lightning Reflexes","spec":null,"multi":false,"desc":"Gain +5 Agility. This does not count toward Advances.","page":121,"bonus":"Ag"},{"name":"Linguistics","base":"Linguistics","spec":null,"multi":false,"desc":"You gain Advantage on Language Tests. Additionally, Advances in any Language Specialisations always cost 50 XP, no matter how many Advances you have already taken. This Talent applies only to languages used for true communication — its effects do not apply to Language (Magick).","page":121},{"name":"Lip Reading","base":"Lip Reading","spec":null,"multi":false,"desc":"You can work out what people are saying by watching their lips move. If you have an unobstructed view of the speaker’s mouth, you can attempt a Challenging (+0 SL) Intuition Test to understand what they are saying.","page":122},{"name":"Luck","base":"Luck","spec":null,"multi":false,"desc":"They say when you were born, Ranald smiled. You gain +1 maximum Fortune. If you wish, you may purchase this Talent up to three times, for a maximum of +3 Fortune.","page":122},{"name":"Magic Resistance","base":"Magic Resistance","spec":null,"multi":false,"desc":"You are resistant to magic. The SL of any Spell that would affect you is reduced by 3. Furthermore, if you have this Talent, you may never learn the Channelling Skill or the Arcane Magic, Bless, Chaos Magic, Invoke, Petty Magic, or Witch! Talents, and vice versa.","page":122},{"name":"Magical Sense","base":"Magical Sense","spec":null,"multi":false,"desc":"You immediately become aware of any spellcasting within your Perception in yards, although you cannot discern the nature of the magic and can tell only the rough direction of the source.","page":122},{"name":"Magnum Opus","base":"Magnum Opus","spec":null,"multi":true,"desc":"When you take this Talent, you may create a single, extraordinary work of art with one of your Art or Trade Skills.","page":122},{"name":"Marksman","base":"Marksman","spec":null,"multi":false,"desc":"Gain +5 Ballistic Skill. This does not count toward Advances.","page":122,"bonus":"BS"},{"name":"Master of Disguise","base":"Master of Disguise","spec":null,"multi":false,"desc":"With nothing but posture changes, face twisting, and careful use of appropriate clothing, you no longer look like yourself. Furthermore, when you successfully use the Entertain (Acting) Skill, you can choose to either use your rolled SL, or the number rolled on your units die.","page":122},{"name":"Master Orator","base":"Master Orator","spec":null,"multi":false,"desc":"You gain Advantage on Lore (Law) Tests made to argue a case before a magistrate, or similar Lore Tests made to argue an academic, theological, or political point before a crowd.","page":122},{"name":"Master Tradesman (Trade)","base":"Master Tradesman","spec":"Trade","multi":true,"desc":"You are a skilled and reliable artisan. When you take this Talent, choose a Trade Specialisation. When you successfully use this Skill, you can choose to either use your rolled SL, or the number rolled on your units die. You may take this Talent more than once, choosing a new Trade Specialisation each time you do.","page":122},{"name":"Menacing","base":"Menacing","spec":null,"multi":false,"desc":"You have an imposing presence, and most people know to steer clear of you. You gain Advantage on Intimidation Tests, and most sensible thieves, bandits, and pickpockets will choose another target as long as one is available.","page":122},{"name":"Mimic","base":"Mimic","spec":null,"multi":false,"desc":"You gain Advantage on Entertain (Acting, Comedy) and Perform (Clowning) Tests. Additionally, you may replicate any accent you are exposed to for at least a day, which may help with dealing with locals in an area at the GM’s discretion.","page":122},{"name":"Night Vision","base":"Night Vision","spec":null,"multi":false,"desc":"Assuming you have at least a faint source of light (such as moonlight obscured by a Marienburg fog, the glowing eyes of a wight, or a bioluminescent fungus) you can see clearly for 20 yards and can extend the effective illumination distance of any light sources by a further 20 yards.","page":123},{"name":"Nimble-fingered","base":"Nimble-fingered","spec":null,"multi":false,"desc":"Gain +5 Dexterity. This does not count toward Advances.","page":123,"bonus":"Dex"},{"name":"Noble Blood","base":"Noble Blood","spec":null,"multi":false,"desc":"Assuming you are dressed appropriately, you are always considered to be at least one Status Tier higher than others unless they also have the Noble Blood Talent, where Status is compared as normal. Furthermore, you may enter the Noble Career as if it were within the same Class as your current Career.","page":123},{"name":"Nose for Trouble","base":"Nose for Trouble","spec":null,"multi":false,"desc":"You are used to getting into, and preferably out of, trouble. You gain Advantage on Intuition Tests, and can usually tell where in a town or village you can find the opportunity to gamble, fight, or get stinking drunk.","page":123},{"name":"Numismatics","base":"Numismatics","spec":null,"multi":false,"desc":"You gain Advantage on Lore (Heraldry) Tests to identify the providence of any coin, medal, or flag. When you successfully make an Evaluate Test to determine the value of an item, you may use either the rolled SL or the value of your units die.","page":123},{"name":"Old Salt","base":"Old Salt","spec":null,"multi":false,"desc":"You are an experienced seaman and are very used to sea life. When you successfully use the Row or Sail Skill on the ocean, you can choose to either use your rolled SL, or the number rolled on your units die. You count as two boatmen towards the minimum number of crew to pilot an ocean-going vessel.","page":123},{"name":"Orientation","base":"Orientation","spec":null,"multi":false,"desc":"You have an instinctive sense of direction. You gain Advantage on Navigation Tests. You also automatically know which direction is north with a glimpse at the stars, trees, or whatever other signs you are familiar with.","page":123},{"name":"Panhandle","base":"Panhandle","spec":null,"multi":false,"desc":"You gain Advantage on Charm Tests while begging, including those made during an Income Endeavour. Additionally, you can usually find the best places to find shelter for a safe but uncomfortable night’s sleep beneath bridges, near middens, and in other urban locations most folks choose to ignore.","page":123},{"name":"Perfect Pitch","base":"Perfect Pitch","spec":null,"multi":false,"desc":"You have perfect pitch, able to replicate notes perfectly. You can learn a piece of music simply by listening to it once, and gain Advantage on Entertain (Singing) and Play (Any) Tests.","page":123},{"name":"Petty Magic","base":"Petty Magic","spec":null,"multi":false,"desc":"Upon learning the Talent, you manifest a number of Spells equal to your Willpower Bonus. You can learn additional Petty Magic Spells for the following cost in XP. Full rules for learning new Spells are provided in Chapter 8: Magic.","page":123},{"name":"Pharmacist","base":"Pharmacist","spec":null,"multi":false,"desc":"You are highly skilled at pharmacy, better able than most to make pills, unguents, oils, creams, and more. When creating an alchemical remedy (see page 154), you produce an additional dose.","page":124},{"name":"Pilot","base":"Pilot","spec":null,"multi":false,"desc":"You are skilled at leading vessels through dangerous waters, high winds, or when making haste to escape pirates or wreckers. Gain Advantage on Row and Sail Tests.","page":124},{"name":"Public Speaker","base":"Public Speaker","spec":null,"multi":false,"desc":"You know how to gather a crowd with ease and can usually gauge the mood of a group and what might motivate them to take action. You gain Advantage on Charm Tests made to influence groups of people.","page":124},{"name":"Pure Soul","base":"Pure Soul","spec":null,"multi":false,"desc":"Your soul is pure, quite resistant to the depredations of Chaos. You may gain double the usual number of Corruption Points before having to Test to resist mutation (see page 188).","page":124},{"name":"Rapid Reload","base":"Rapid Reload","spec":null,"multi":false,"desc":"You reload ranged weapons with practised ease. When using a weapon with the Reload Flaw, reduce the number of the Reload Flaw by 1.","page":124},{"name":"Reaction Strike","base":"Reaction Strike","spec":null,"multi":false,"desc":"When you are Charged, you may attempt a Challenging (+0 SL) Initiative Test to gain an immediate free attack against that charger outside the normal Turn sequence. This attack is resolved with whatever weapon you are carrying in your primary hand. You can only make one free attack this way each round.","page":124},{"name":"Read/Write","base":"Read/Write","spec":null,"multi":false,"desc":"The written word remains a mystery to most denizens of the Empire, but you have learned your letters and can read and write in any language you can speak.","page":124},{"name":"Relentless","base":"Relentless","spec":null,"multi":false,"desc":"If an opponent Disengages from you, you can attempt a Challenging (+0 SL) Athletics, Drive, or Ride Test after their Turn ends. A success provides an extra Move to chase after them and lets you freely Disengage from all other opponents to do so. Further, any Tests to chase as a Pursuer in a Pursuit benefit from +1 SL.","page":124},{"name":"Resistant (Threat)","base":"Resistant","spec":"Threat","multi":true,"desc":"Once per session, before rolling a Test to resist a specific Threat (such as Disease, Magic, Corruption, Poison), you may choose to automatically pass that Test. You gain Advantage on all further Tests to resist that threat. You may take this Talent more than once, picking a new Threat each time.","page":124},{"name":"Resolute","base":"Resolute","spec":null,"multi":false,"desc":"You stand firm in the face of danger with grim determination. When you gain a Condition, you may retain your Momentum if you pass a Challenging (+0 SL) Cool Test.","page":124},{"name":"Reversal","base":"Reversal","spec":null,"multi":false,"desc":"You are used to desperate combats, able to find opportunities to gain an edge in dire circumstances. In an Opposed Melee Test where you are struck but your Test succeeded, you retain Momentum.","page":124},{"name":"Riposte","base":"Riposte","spec":null,"multi":false,"desc":"Conforming to ‘the best defence is offence’, you respond to an incoming attack with a counterstrike of your own. If you win an Opposed Test when defending in melee combat, you cause Damage as if you were the attacker.","page":124},{"name":"River Guide","base":"River Guide","spec":null,"multi":false,"desc":"You know all the tricks for navigating dangerous rivers. You need not Test to navigate dangerous waters unless the Difficulty is Difficult (-1 SL) or lower. If you also have the appropriate Lore (Local) Skill, you never need to Test — you are assumed to know a safe route.","page":124},{"name":"Robust","base":"Robust","spec":null,"multi":false,"desc":"You are as tough as old boots and quickly recover from injury. Whenever you test to heal Wounds you may heal an additional 2 Wounds.","page":124},{"name":"Roughrider","base":"Roughrider","spec":null,"multi":false,"desc":"Assuming you have the Ride Skill, you can direct your mount to take an Action, as well as a Move, without a Ride Test. If a Ride Test is required, you may make it with Advantage. Furthermore, when mounted in a Pursuit, add +1 to the animal’s Movement Attribute.","page":125},{"name":"Rover","base":"Rover","spec":null,"multi":false,"desc":"You are at home in wild places, moving quickly and quietly through Taal’s own realm. You gain Advantage on Stealth (Rural) Tests, and can usually determine the easiest route through an area, as well as where to find game, water, and shelter.","page":125},{"name":"Savant (Lore Specialisation)","base":"Savant","spec":"Lore Specialisation","multi":true,"desc":"You are exceptionally learned and have a significant degree of specialised knowledge in your field of study. Choose any Lore Specialisation you possess. Tests made using this Lore Specialisation are made with Advantage. You may acquire this Talent more than once, choosing a new Lore Specialisation each time you do so.","page":125},{"name":"Savvy","base":"Savvy","spec":null,"multi":false,"desc":"Gain +5 Intelligence. This does not count toward Advances.","page":125,"bonus":"Int"},{"name":"Scale Sheer Surface","base":"Scale Sheer Surface","spec":null,"multi":false,"desc":"You are an exceptional climber. You gain Advantage on Climb Tests. Additionally, you can attempt to climb even seemingly impossible surfaces such as sheer fortifications, ice shelves, greased poles, and similar, at a maximum imposed Difficulty of Very Hard (-3 SL).","page":125},{"name":"Schemer","base":"Schemer","spec":null,"multi":false,"desc":"You are a master of politics, seeing conspiracy around every corner, and are adept at weaselling secrets and rumour from those in the know. When you successfully use Gossip or Lore (Politics), you can choose to either use your rolled SL, or the number rolled on your units die.","page":125},{"name":"Sea Legs","base":"Sea Legs","spec":null,"multi":false,"desc":"You are used to the rolling motion of the oceans, and are unlikely to get seasick, even in the worst storms. Under normal conditions, you need never Test to see if you become seasick, and you gain Advantage on Tests to avoid it should the GM require one.","page":125},{"name":"Seasoned Traveller","base":"Seasoned Traveller","spec":null,"multi":false,"desc":"You are an inquisitive soul who has travelled far and wide, and quickly pick up all manner of local information. You can always advance the relevant regional Lore (Local) Skill whilst you remain in that region, even if it is not part of your current Career.","page":125},{"name":"Second Sight","base":"Second Sight","spec":null,"multi":false,"desc":"You can perceive the shifting Winds of Magic that course from the Chaos Gates at the poles of the world. You now have the ability to percieve the Winds of Magic (see page 236).","page":125},{"name":"Secret Identity","base":"Secret Identity","spec":null,"multi":false,"desc":"You can adopt an alternate persona with a Career of your choice for a set period of time (an encounter, a day, an entire adventure) without having to Test to maintain the charade, and during this period you are treated as having the Class and Status of the chosen Career.","page":125},{"name":"Shadow","base":"Shadow","spec":null,"multi":false,"desc":"You instinctively know when to abandon a tail before your quarry spots you. If someone you are following succeeds on a Perception Test to spot you, you may either allow them to spot you and continue following them, or lose track of them and remain unseen.","page":125},{"name":"Sharp","base":"Sharp","spec":null,"multi":false,"desc":"Gain +5 Initiative. This does not count toward Advances.","page":125,"bonus":"I"},{"name":"Sharpshooter","base":"Sharpshooter","spec":null,"multi":false,"desc":"Ranged Tests you make do not incur any penalties from your target being Prone or in cover. You may also perform feats of accuracy with your weapons that most would think impossible, such as cutting a hangman’s noose with an arrow or punching a hole in a tossed coin with a pistol shot.","page":125},{"name":"Shieldsman","base":"Shieldsman","spec":null,"multi":false,"desc":"Once per Round, while carrying a shield, you may lose Momentum to either grant your shield’s AP bonus to an adjacent ally who is not carrying a shield, or, if you win an Opposed Melee Test while attacking or defending, push your opponent up to 2 yards directly away and no longer count as Engaged.","page":125},{"name":"Sixth Sense","base":"Sixth Sense","spec":null,"multi":false,"desc":"You get a strange feeling whenever danger is near. If you are about to trigger a trap or fall victim to a hidden danger, such as an ambush, collapsing tunnel, or poisoned glass of wine, you may make a Challenging (+0 SL) Intuition Test. On a success, you detect the danger at the last possible moment.","page":126},{"name":"Small","base":"Small","spec":null,"multi":false,"desc":"You are much shorter than most folk in the Old World. Gain Size (Small). The full rules for different Sizes are found in Chapter 12: Bestiary on page 360.","page":126},{"name":"Sniper","base":"Sniper","spec":null,"multi":false,"desc":"Distance is of no import to your shooting skills, and you are just as adept at picking off far away targets as those nearby. You suffer no penalties for shooting at Long Range, and only a -1 SL penalty for shots made at Extreme Range.","page":126},{"name":"Speedreader","base":"Speedreader","spec":null,"multi":false,"desc":"You read books at a voracious pace. A single glance is all you require to read a full page of text, and you can easily make your way through even a lengthy tome in a single day. When you make an Extended Research Test, double the SL added by any successful Test you make.","page":126},{"name":"Sprinter","base":"Sprinter","spec":null,"multi":false,"desc":"You are a swift runner with a good level of physical fitness. You gain Advantage on Athletics Tests to run and jump.","page":126},{"name":"Step Aside","base":"Step Aside","spec":null,"multi":false,"desc":"You are skilled at being where enemy weapons are not. If you successfully use Dodge to defend against an attack, you may move up to 2 yards as you dive away, and no longer count as Engaged. Opponents do not gain a free attack when you do this.","page":126},{"name":"Stone Soup","base":"Stone Soup","spec":null,"multi":false,"desc":"You are used to getting by with less, and know how to survive lean times. If a member of the party makes a Foraging Test (see page 152), they automatically locate sufficient food to feed you, over and above the number of Characters fed by the Test result, even if the Test fails.","page":126},{"name":"Stout-hearted","base":"Stout-hearted","spec":null,"multi":false,"desc":"No matter how bad things get, you always seem to come back for more. The first time in an encounter you gain one or more Broken Conditions, you gain one less.","page":126},{"name":"Slayer","base":"Slayer","spec":null,"multi":false,"desc":"You are undaunted by large enemies and attack them with great gusto. If you Charge a creature whose Size is larger than you, you automatically gain Momentum.","page":126},{"name":"Sturdy","base":"Sturdy","spec":null,"multi":false,"desc":"You have a brawny physique, or are very used to carrying things. When calculating the number of Encumbrance Points you can carry, count your Strength Bonus twice.","page":127},{"name":"Suave","base":"Suave","spec":null,"multi":false,"desc":"Gain +5 Fellowship. This does not count toward Advances.","page":127,"bonus":"Fel"},{"name":"Super Numerate","base":"Super Numerate","spec":null,"multi":false,"desc":"You have a gift for calculation and can work out solutions to most mathematical problems with ease, without the need for a quill, paper, or abacus. You gain Advantage on Evaluate Tests, and you can keep track of the passage of time accurately so long as you are conscious.","page":127},{"name":"Supportive","base":"Supportive","spec":null,"multi":false,"desc":"You know what to say and when to make the most impact upon your superiors. You not only ignore the penalty to using Charm on those of a higher Status Tier, but also gain Advantage on Charm Tests made to ingratiate yourself with those of higher Status.","page":127},{"name":"Sure Shot","base":"Sure Shot","spec":null,"multi":false,"desc":"Your Ranged Attacks inflict +1 Damage, and may ignore armour with the Partial Flaw. If your weapon has the Impale Quality, you can ignore armour with the Weakpoints Flaw as well.","page":127},{"name":"Surgery","base":"Surgery","spec":null,"multi":false,"desc":"When you successfully use the Heal Skill outside of combat, you can choose to either use your rolled SL, or the number rolled on your units die. Furthermore, you can treat any Critical Wound marked as needing Surgery, for effects see pages 172 to 179.","page":127},{"name":"Tenacious","base":"Tenacious","spec":null,"multi":false,"desc":"You are a vigorous sort. The first time in an encounter you would gain one or more Fatigued Conditions, you gain one less.","page":127},{"name":"Tinker","base":"Tinker","spec":null,"multi":false,"desc":"You are somewhat of a Johann-of-all-trades, able to repair almost anything. You count all Trade Skills as Basic when repairing broken items. If you have at least 1 Advance in a Trade Skill, you have Advantage on Tests to repair associated items, and such repairs take half as much time.","page":127},{"name":"Striding Gait (Terrain)","base":"Striding Gait","spec":"Terrain","multi":true,"desc":"You ignore all movement penalties when crossing over or through a specified terrain. If engaged in a Pursuit in your chosen terrain, you receive +2 SL to all Tests relating to the Pursuit. Example Terrains are: Coastal, Desert, Rocky, Tundra, Wetland, Woodland.","page":127},{"name":"Strike Mighty Blow","base":"Strike Mighty Blow","spec":null,"multi":false,"desc":"You know how to hit hard! You inflict +1 extra Damage with melee weapons, or +2 if your attack was made with Advantage.","page":127},{"name":"Strike to Injure","base":"Strike to Injure","spec":null,"multi":false,"desc":"You are an expert at striking your enemies’ most vulnerable areas. When rolling on a Critical Wound table, roll twice and choose which result you prefer. Further, you ignore the Called Shot penalty when going for a Silent Takedown (see page 135).","page":127},{"name":"Strike to Stun","base":"Strike to Stun","spec":null,"multi":false,"desc":"You know how to use your weapon to subdue, not kill. You count all Improvised Weapons as having the Pummel Quality. When using a Pummel weapon, ignore the Called Shot penalty when going for a Silent Takedown (see page 135).","page":127},{"name":"Strong Back","base":"Strong Back","spec":null,"multi":true,"desc":"You have a strong back that is used to hard work. You gain a bonus of +1 SL to any Opposed Strength Test, and the amount of Encumbrance you can carry increases by one. If you wish, you may purchase this Talent a second time, increasing the bonus to +3 SL and the number of additional Encumbrance points to three.","page":127},{"name":"Strong Legs","base":"Strong Legs","spec":null,"multi":false,"desc":"You have strong legs able to carry you great distances when you jump. When you successfully use the Athletics Skill to sprint or leap, you can choose to either use your rolled SL, or the number rolled on your units die.","page":127},{"name":"Strong-minded","base":"Strong-minded","spec":null,"multi":false,"desc":"You are the epitome of determination and resolve. Once per session, before taking a Test, you may choose to take that Test without any negative modifiers.","page":127},{"name":"Strong Swimmer","base":"Strong Swimmer","spec":null,"multi":false,"desc":"You are an accomplished swimmer, able to fight a strong current and outpace other swimmers. You gain Advantage on Swim Tests, and receive a +2 SL Bonus to swimming Pursuits.","page":127},{"name":"Tower of Memories","base":"Tower of Memories","spec":null,"multi":false,"desc":"When you successfully use the Lore Skill, you can choose to either use your rolled SL, or the number rolled on your units die.","page":128},{"name":"Trapper","base":"Trapper","spec":null,"multi":false,"desc":"You are skilled at using all manner of traps, and know how to make basic snares and pitfalls from whatever comes to hand. You gain Advantage on Set Trap Tests. Additionally, with an hour to prepare, you can craft a small animal trap or covered pit (see page 136).","page":128},{"name":"Trick Rider","base":"Trick Rider","spec":null,"multi":false,"desc":"You are capable of amazing feats of agility while in the saddle. You can use any of your Perform Skills and unmodified Dodge Skill when mounted.","page":128},{"name":"Tunnel Fighter","base":"Tunnel Fighter","spec":null,"multi":false,"desc":"You are at home in tunnels, sewers, and other underground environments. You gain Advantage on Stealth (Underground) Tests, and can easily tell how far you have travelled underground and roughly how deep beneath the surface you are.","page":128},{"name":"Unshakeable","base":"Unshakeable","spec":null,"multi":false,"desc":"You are a jaded veteran who has survived more than one hail of shots from blackpowder weapons. You do not need to Test to resist a Broken Condition if shot at by a Blackpowder weapon.","page":128},{"name":"Very Resilient","base":"Very Resilient","spec":null,"multi":false,"desc":"Gain +5 Toughness. This does not count toward Advances.","page":128,"bonus":"T"},{"name":"Very Strong","base":"Very Strong","spec":null,"multi":false,"desc":"Gain +5 Strength. This does not count toward Advances.","page":128,"bonus":"S"},{"name":"War Leader","base":"War Leader","spec":null,"multi":false,"desc":"All allies you influence with Leadership during battle (see page 169) may use your Leadership rather than their Cool to resist Fear until the end of the battle. The effect ends if you die, or while you are subject to Broken, Unconscious, or Fear Conditions.","page":128},{"name":"Warrior Born","base":"Warrior Born","spec":null,"multi":false,"desc":"Gain +5 Weapon Skill. This does not count toward Advances.","page":128,"bonus":"WS"},{"name":"War Wizard","base":"War Wizard","spec":null,"multi":false,"desc":"You are trained to cast magic while in the thick of combat. On your Turn, you may cast one Spell with a Casting Number of 5 or less for free without using your Action. If you do this, you may not cast another Spell this Turn.","page":128},{"name":"Waterman","base":"Waterman","spec":null,"multi":false,"desc":"You are an experienced freshwater sailor and are well-versed with river vessels. When you successfully use the Row or Sail Skill on a river or lake, you can choose to either use your rolled SL, or the number rolled on your units die. You count as two crewmen towards the minimum number of crew to pilot a river vessel.","page":128},{"name":"Wealthy","base":"Wealthy","spec":null,"multi":true,"desc":"You are fabulously wealthy and are rarely ever short of coin. For the purpose of securing money through your Career, either during play or performing an Income Endeavour, you obtain 1 additional gold crown. You may take this Talent a second time, allowing you to secure 3 additional gold crowns instead.","page":128},{"name":"Well-prepared","base":"Well-prepared","spec":null,"multi":false,"desc":"Once per session, you may pull a Trapping required for the current situation from your pockets, as long as it is Encumbrance 0, could feasibly have been bought recently, and does not stretch credulity too far. You can use this Talent more times in the same session by spending Fortune.","page":128},{"name":"Witch!","base":"Witch!","spec":null,"multi":false,"desc":"Gain one Spell of your choice from any Colour Lore or the Lore of Witchcraft, even if you lack the appropriate Arcane Magic Talent. Further, treat that Spell’s Channelling Skill as a Basic Skill.","page":128}],"spells":[{"name":"Animal Friend","page":240,"cn":"0","range":"1 yard","target":"1","duration":"1 hour","desc":"You make friends with a creature that is smaller than you and possesses the Bestial Creature Trait. The animal trusts you completely and regards you as a friend.","lore":"Petty"},{"name":"Bearings","page":240,"cn":"0","range":"You","target":"You","duration":"Instant","desc":"You sense the influx of the Winds of Magic from their source. You know which direction north is.","lore":"Petty"},{"name":"Careful Step","page":240,"cn":"0","range":"You","target":"You","duration":"Agility minutes","desc":"The magic flowing through your feet ensures any organic matter you tread upon remains undamaged: twigs do not break, grass springs back to its original position, and even delicate flowers are unharmed. Those seeking to use the Track Skill to pursue you through rural terrain suffer a -3 SL penalty to their Tests.","lore":"Petty"},{"name":"Conserve","page":240,"cn":"0","range":"1 yard","target":"Special","duration":"Willpower Bonus days","desc":"You preserve up to a day’s worth of rations. During this time they will not rot, develop mould, or go stale, although they can still be harmed by external factors, such as getting wet or being burned or poisoned.","lore":"Petty"},{"name":"Dart","page":240,"cn":"0","range":"Willpower yards","target":"1","duration":"Instant","desc":"You cause a small dart of magical energy to fly from your fingers. This is a magic missile with a Damage of +0.","lore":"Petty"},{"name":"Dazzle","page":240,"cn":"0","range":"Touch","target":"1","duration":"Willpower Bonus Rounds","desc":"The target gains 1 Blinded Condition, and gains 1 Blinded Condition at the start of each Round for the duration of the Spell.","lore":"Petty"},{"name":"Drain","page":240,"cn":"0","range":"Touch","target":"1","duration":"Instant","desc":"You touch your target, draining their life. This counts as a magic missile with Damage +0 that ignores Armour Points. You then heal 1 Wound.","lore":"Petty"},{"name":"Eavesdrop","page":241,"cn":"0","range":"Initiative yards","target":"1","duration":"Willpower Bonus minutes","desc":"You can hear what your target says as if you were standing right next to them.","lore":"Petty"},{"name":"Gust","page":241,"cn":"0","range":"Willpower yards","target":"Special","duration":"Instant","desc":"You create a brief gust of wind, strong enough to blow out a candle, cause an open door to slam, or blow a few pages to the floor.","lore":"Petty"},{"name":"Light","page":241,"cn":"0","range":"You","target":"You","duration":"Willpower minutes","desc":"You create a small light, roughly equivalent to a torch, which glows from your hand, staff, or some other part of your person. While the Spell is active, you may choose to increase the illumination to that of a lantern, or decrease it to that of a candle, if you pass an Average (+2 SL) W
